<div
  class="h-screen bg-gray-900 text-white fixed left-0 top-0 shadow-xl transition-all duration-300"
  [class.w-64]="aberto"
  [class.w-20]="!aberto"
>

  <!-- TOPO -->
  <div class="p-4 border-b border-gray-700 flex items-center justify-between">

    <h1
      *ngIf="aberto"
      class="text-xl font-bold"
    >
      Ponto System
    </h1>

    <button
      (click)="toggleSidebar()"
      class="p-2 hover:bg-gray-800 rounded-lg transition"
    >
      ☰
    </button>

  </div>

  <!-- MENU -->
  <nav class="flex flex-col p-4 gap-2">

    <a
      routerLink="/home"
      routerLinkActive="bg-green-600"
      class="p-3 rounded-lg hover:bg-gray-800 transition flex items-center gap-3"
    >
      <span>🏠</span>

      <span *ngIf="aberto">
        Home
      </span>
    </a>

    <a
      routerLink="/ajuste"
      routerLinkActive="bg-green-600"
      class="p-3 rounded-lg hover:bg-gray-800 transition flex items-center gap-3"
    >
      <span>⚙️</span>

      <span *ngIf="aberto">
        Ajustes
      </span>
    </a>

  </nav>

  <!-- FOOTER -->
  <div class="absolute bottom-0 w-full p-4 border-t border-gray-700">

    <button
      (click)="logout()"
      class="w-full bg-red-500 hover:bg-red-600 p-3 rounded-lg transition flex items-center justify-center gap-2"
    >
      <span>🚪</span>

      <span *ngIf="aberto">
        Sair
      </span>
    </button>

  </div>

</div>
