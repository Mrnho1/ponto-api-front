<div class="max-w-2xl mx-auto">

  <h2 class="text-2xl font-bold mb-4">
    Registro de Ponto
  </h2>

  <button
  (click)="baterPonto()"
  class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 mb-6"
>
  {{ getProximoTipo() }}
</button>

  <div class="bg-white rounded-xl shadow p-4">

    <h3 class="font-bold mb-2">Histórico</h3>

    <ul>
      <li
        *ngFor="let p of pontos"
        class="border-b py-2 flex justify-between"
      >
        <span>{{ p.tipo }}</span>
        <span>{{ p.data_hora | date:'short' }}</span>
      </li>
    </ul>

  </div>

</div>
