<app-navbar></app-navbar>

<div
  class="p-10 transition-all duration-300"
  [class.ml-64]="true"
>

  <h2 class="text-3xl font-bold mb-6">
    Registro de Ponto
  </h2>

  <button
    (click)="baterPonto()"
    class="bg-green-600 text-white px-6 py-3 rounded-xl hover:bg-green-700 mb-8"
  >
    {{ getProximoTipo() }}
  </button>

  <div class="bg-white rounded-2xl shadow p-6">

    <h3 class="font-bold text-xl mb-4">
      Histórico
    </h3>

    <ul>
      <li
        *ngFor="let p of pontos"
        class="border-b py-3 flex justify-between"
      >
        <span>{{ p.tipo }}</span>
        <span>{{ p.data_hora | date:'short' }}</span>
      </li>
    </ul>

  </div>

</div>
