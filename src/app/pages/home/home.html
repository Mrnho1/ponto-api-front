<div class="p-10 bg-gray-100 min-h-screen transition-all duration-300" [class.ml-64]="true">
  <p>{{ telaAtual }}</p>
  <!-- DASHBOARD -->
  <div *ngIf="telaAtual === 'dashboard'">

    <h1 class="text-3xl font-bold mb-8">
      Dashboard
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">

      <div class="bg-white p-6 rounded-2xl shadow">

        <h2 class="text-gray-500 mb-2">
          Banco de Horas
        </h2>

        <p class="text-3xl font-bold">
          {{ bancoHoras }}
        </p>

      </div>

      <div class="bg-white p-6 rounded-2xl shadow">

        <h2 class="text-gray-500 mb-2">
          Pontos Hoje
        </h2>

        <p class="text-3xl font-bold">
          {{ pontos.length }}
        </p>

      </div>

      <div class="bg-white p-6 rounded-2xl shadow">

        <h2 class="text-gray-500 mb-2">
          Último Registro
        </h2>

        <p class="text-xl font-bold">
          {{ ultimoPonto?.tipo || 'Nenhum' }}
        </p>

      </div>

    </div>

    <button (click)="baterPonto()" class="bg-green-600 text-white px-6 py-3 rounded-2xl hover:bg-green-700 mb-8 shadow">
      {{ getProximoTipo() }}
    </button>

  </div>

  <!-- HISTÓRICO -->
  <div *ngIf="telaAtual === 'historico'" class="bg-white rounded-2xl shadow p-6">

    <h2 class="text-2xl font-bold mb-6">
      Histórico
    </h2>

    <ul>

      <li *ngFor="let p of pontos" class="border-b py-4 flex justify-between">

        <span class="font-medium">
          {{ p.tipo }}
        </span>

        <span>
          {{ p.data_hora | date:'short' }}
        </span>

      </li>

    </ul>

  </div>

</div>
