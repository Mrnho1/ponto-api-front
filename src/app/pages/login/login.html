<div class="flex items-center justify-center min-h-screen bg-gray-100">

  <div class="bg-white p-8 rounded-2xl shadow-md w-80">

    <h2 class="text-2xl font-bold mb-6 text-center">
      Login
    </h2>

    <input [(ngModel)]="username" placeholder="Usuário"
      class="w-full mb-4 p-2 border rounded" />

    <input [(ngModel)]="password" type="password"
      placeholder="Senha"
      class="w-full mb-4 p-4 border rounded" />

    <button (click)="login()"
      class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 mb-4">
      Entrar
    </button>

    <p class="text-center text-sm">
      Não tem conta?
      <a routerLink="/register" class="text-blue-600 hover:underline">
        Cadastre-se
      </a>
    </p>

  </div>

</div>
