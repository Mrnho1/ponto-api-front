<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 px-4">

  <div class="w-full max-w-md bg-white/10 backdrop-blur-md border border-white/10 rounded-3xl shadow-2xl p-10">

    <div class="flex flex-col items-center mb-8">

      <div class="w-20 h-20 rounded-2xl bg-blue-600 flex items-center justify-center text-4xl shadow-lg mb-4">
        ⏰
      </div>

      <h1 class="text-3xl font-bold text-white">
        Ponto System
      </h1>

      <p class="text-gray-300 mt-2 text-sm">
        Faça login para continuar
      </p>

    </div>

    <div class="space-y-5">

      <div>

        <label class="text-sm text-gray-300 block mb-2">
          Usuário
        </label>

        <input
          [(ngModel)]="username"
          placeholder="Digite seu usuário"
          class="w-full p-4 rounded-xl bg-white/10 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        />

      </div>

      <div>

        <label class="text-sm text-gray-300 block mb-2">
          Senha
        </label>

        <input
          [(ngModel)]="password"
          type="password"
          placeholder="Digite sua senha"
          class="w-full p-4 rounded-xl bg-white/10 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        />

      </div>

      <button
        (click)="login()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-xl transition duration-300 shadow-lg hover:scale-[1.02]"
      >
        Entrar
      </button>

    </div>

    <div class="mt-8 text-center">

      <p class="text-gray-400 text-sm">
        Não tem conta?

        <a
          routerLink="/register"
          class="text-blue-400 hover:text-blue-300 hover:underline ml-1"
        >
          Cadastre-se
        </a>

      </p>

    </div>

  </div>

</div>
